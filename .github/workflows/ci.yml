name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs migrate + seed-pages + apply-distro against the
      # local SQLite fallback, so the DB-dependent checks below work
      # without secrets.
      - run: npm ci

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Playwright chromium for the contrast walker; cached so the
      # ~160MB download happens once per lockfile, not per run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install chromium

      - run: npx tsc --noEmit

      - run: npm run check:themes

      # Postgres boolean-column guard: rejects `col = 1` / `SET col = 0`
      # against BOOLEAN columns (invalid in Postgres, silently accepted
      # by SQLite) at merge time instead of on the deployed DB.
      - run: node scripts/check-boolean-sql.mjs

      - run: npm run build

      # WCAG AA contrast walker: every rendered text surface on public,
      # tenant-admin, and superadmin routes in light + dark themes.
      # Spawns `next start` against the freshly built .next; the
      # postinstall seed provides the demo license + admin account.
      - run: node scripts/check-contrast.mjs

      - run: npm run verify:deploy

      # Lint only the diff: the repo carries a legacy lint debt, so the
      # gate is "no new errors on changed files", not a full-repo pass.
      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/lint-changed.mjs
